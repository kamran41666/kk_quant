version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: kk_quant_server
    ports:
      # The live control plane has no user-session auth in Phase 3A.  Keep the
      # host-side API bound to loopback so it cannot be reached from a LAN;
      # containers still communicate over the private compose network.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./backtest_result:/app/backtest_result
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kk_quant_web
    ports:
      # Keep the beginner UI and its proxied /api/v1/live control plane local
      # until Phase 3C authentication is installed.
      - "127.0.0.1:80:80"
    depends_on:
      - server
    restart: unless-stopped
